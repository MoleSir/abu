[package]
name = "learn-claude-code"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "s01_agent_loop"
path = "./agents/s01_agent_loop.rs"

[[bin]]
name = "s02_tool_use"
path = "./agents/s02_tool_use.rs"

[[bin]]
name = "s03_todo_write"
path = "./agents/s03_todo_write.rs"

[[bin]]
name = "s04_subagent"
path = "./agents/s04_subagent.rs"

[[bin]]
name = "s05_skill_loading"
path = "./agents/s05_skill_loading.rs"

[[bin]]
name = "s06_context_compact"
path = "./agents/s06_context_compact.rs"

[[bin]]
name = "s07_permission_system"
path = "./agents/s07_permission_system.rs"

[[bin]]
name = "s08_hook_system"
path = "./agents/s08_hook_system.rs"

[[bin]]
name = "s09_memory_system"
path = "./agents/s09_memory_system.rs"

[[bin]]
name = "s13_background_tasks"
path = "./agents/s13_background_tasks.rs"

[[bin]]
name = "s15_agent_teams"
path = "./agents/s15_agent_teams.rs"


[dependencies]
abu-agent = { path = "../../abu-agent" }
abu-provider = { path = "../../abu-provider" }
abu-tool = { path = "../../abu-tool" }
abu-macros = { path = "../../abu-macros" }

tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "fs"] }
anyhow = "1.0"
dotenv = "0.15.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
regex = "1.12.3"
uuid = "1.23.1"
chrono = { version = "0.4", features = ["serde"] }
