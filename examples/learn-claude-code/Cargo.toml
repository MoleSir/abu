[package]
name = "learn-claude-code"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "s01_agent_loop"
path = "./agents/s01_agent_loop.rs"

[[bin]]
name = "s02_tool_use"
path = "./agents/s02_tool_use.rs"

[[bin]]
name = "s03_todo_write"
path = "./agents/s03_todo_write.rs"

[[bin]]
name = "s04_subagent"
path = "./agents/s04_subagent.rs"

[[bin]]
name = "s05_skill_loading"
path = "./agents/s05_skill_loading.rs"

[[bin]]
name = "s07_permission_system"
path = "./agents/s07_permission_system.rs"


[dependencies]
abu-agent = { path = "../../abu-agent" }
abu-provider = { path = "../../abu-provider" }
abu-tool = { path = "../../abu-tool" }
abu-macros = { path = "../../abu-macros" }

tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
dotenv = "0.15.0"
async-trait = "0.1"
serde = "1.0"
serde_json = "1.0"
tracing-subscriber = "0.3.23"
